<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-App</title>

    <link rel="shortcut icon" href="icons/favicon.svg" type="image/x-icon">

    <meta name="theme-color" content="#052c65">

    <!-- Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    <script src="database.js"></script>
    <script src="script.js"></script>
</head>

<body onload="init()">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 fs-5 fs-sm-4 fw-semibold">Welcome to my Quiz!</span>
        </div>
    </nav>

    <section class="main-content">
        <div class="quiz-wrapper d-flex flex-column flex-md-row shadow">

            <!-- Kategorien: oben scrollbar auf Mobilgeräten, links als Spalte ab md -->
            <aside class="category-sidebar border-bottom border-md-bottom-0 border-md-end bg-white">
                <div
                    class="list-group list-group-flush flex-row flex-md-column justify-content-md-evenly overflow-auto">
                    <a href="#" class="list-group-item list-group-item-action active text-nowrap"
                        onclick="filterCategory('all', event, this)">All Categories</a>
                    <a href="#" class="list-group-item list-group-item-action text-nowrap"
                        onclick="filterCategory('movies', event, this)">Movies</a>
                    <a href="#" class="list-group-item list-group-item-action text-nowrap"
                        onclick="filterCategory('games', event, this)">Games</a>
                    <a href="#" class="list-group-item list-group-item-action text-nowrap"
                        onclick="filterCategory('austria', event, this)">Austria</a>
                    <a href="#" class="list-group-item list-group-item-action text-nowrap"
                        onclick="filterCategory('frontend', event, this)">Frontend</a>
                </div>
            </aside>

            <!-- Hauptbereich -->
            <div class="quiz-main-content d-flex flex-column flex-grow-1 bg-white">
                <img src="./icons/main-logo.svg" class="quiz-logo" alt="Main Logo">

                <div class="progress mx-3" role="progressbar" aria-label="Quiz progress" aria-valuenow="0"
                    aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" id="progress-bar" style="width: 0%">0%</div>
                </div>

                <!-- Endscreen -->
                <div class="card-body endscreen-view p-3 p-md-4" id="endscreen" style="display: none;">
                    <div class="endscreen-text">
                        <h3 class="h4 h3-md mb-2">Congratulations!</h3>
                        <p class="mb-3">You answered <b id="score">X</b> of <b id="amount-of-questions">X</b> Questions
                            correctly!</p>
                        <button onclick="restartGame()" class="btn btn-primary">Restart</button>
                    </div>
                    <img src="./icons/trophy.png" alt="Trophy" class="endscreen-trophy">
                </div>

                <!-- Question Body -->
                <div class="card-body p-3 p-md-4" id="question-body">
                    <h5 class="card-title fs-6 fs-sm-5 mb-3 mb-md-4" id="questiontext">Question</h5>

                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-dark text-start p-2 p-sm-3 quiz-answer"
                            id="answer_1" onclick="answer('answer_1')">Answer</button>
                        <button type="button" class="btn btn-outline-dark text-start p-2 p-sm-3 quiz-answer"
                            id="answer_2" onclick="answer('answer_2')">Answer</button>
                        <button type="button" class="btn btn-outline-dark text-start p-2 p-sm-3 quiz-answer"
                            id="answer_3" onclick="answer('answer_3')">Answer</button>
                        <button type="button" class="btn btn-outline-dark text-start p-2 p-sm-3 quiz-answer"
                            id="answer_4" onclick="answer('answer_4')">Answer</button>
                    </div>

                    <div class="question-footer mt-4">
                        <p class="mb-0"><b id="question-number">1</b> of <b id="all-questions">5</b> questions</p>
                        <button onclick="nextQuestion()" class="btn btn-primary" id="next-button" disabled>Next</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>

</html>
